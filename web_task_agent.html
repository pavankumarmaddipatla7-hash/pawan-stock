<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAgent - Web Task Executor</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 20, 0.8);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --terminal-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h1::before {
            content: '';
            display: inline-block;
            width: 15px;
            height: 15px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        input[type="url"], textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
            background: #0ea5e9;
        }

        button:disabled {
            background: #4b5563;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Terminal Window */
        .terminal {
            background: var(--terminal-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 250px;
        }

        .terminal-header {
            background: #1e293b;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background: #ef4444; }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: #10b981; }

        .terminal-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
            margin-left: 10px;
        }

        .terminal-body {
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: var(--primary);
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .log-line {
            line-height: 1.4;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .log-prefix { color: #f59e0b; }
        .log-error { color: #ef4444; }
        .log-success { color: #10b981; }
        .log-info { color: #38bdf8; }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--primary);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Web Task Executor Agent</h1>
            <p>Specify the target website and exactly what you want the agent to do.</p>
        </div>

        <div class="workspace">
            <div class="input-group">
                <label for="urlInput">Target Website URL</label>
                <input type="url" id="urlInput" placeholder="https://www.amazon.com" required>
            </div>

            <div class="input-group">
                <label for="taskInput">What specifically do you want the agent to do?</label>
                <textarea id="taskInput" placeholder="Example: Search for 'wireless mouse', click on the first result, and extract the price and product description..." required></textarea>
            </div>

            <button id="runBtn" onclick="executeTask()">Initiate Agent Sequence</button>

            <div class="terminal">
                <div class="terminal-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                    <span class="terminal-title">agent_execution_log.sh</span>
                </div>
                <div class="terminal-body" id="terminalLog">
                    <div class="log-line">Waiting for user command...<span class="cursor" id="cursor"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const terminalLog = document.getElementById('terminalLog');
        const cursor = document.getElementById('cursor');

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.innerHTML = `[${time}] <span class="log-prefix">~</span> ${message}`;
            
            // Insert before cursor
            terminalLog.insertBefore(line, cursor.parentNode);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        async function executeTask() {
            const url = document.getElementById('urlInput').value.trim();
            const task = document.getElementById('taskInput').value.trim();
            const btn = document.getElementById('runBtn');

            if (!url) {
                alert("Please enter a Target Website URL.");
                return;
            }
            if (!task) {
                alert("Please specify what you want the agent to do.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Agent Working...";
            
            // Clear previous logs except cursor
            Array.from(terminalLog.children).forEach(child => {
                if(child.id !== 'cursor' && child.querySelector('.cursor') === null) {
                    child.remove();
                }
            });

            // Simulation Sequence
            const sequence = [
                { msg: `Initializing Web Agent...`, delay: 500, type: 'info' },
                { msg: `Connecting to ${url}...`, delay: 1000, type: 'info' },
                { msg: `Bypassing CAPTCHAs and security checks...`, delay: 2000, type: 'info' },
                { msg: `Analyzing DOM structure...`, delay: 1500, type: 'info' },
                { msg: `Interpreting Task: "${task}"`, delay: 1000, type: 'info' },
                { msg: `Locating relevant elements on the page...`, delay: 2000, type: 'info' },
                { msg: `Executing requested actions...`, delay: 2500, type: 'info' },
                { msg: `Extracting requested data...`, delay: 1500, type: 'info' },
                { msg: `Task successfully completed. Data saved to local memory.`, delay: 1000, type: 'success' }
            ];

            for (const step of sequence) {
                await new Promise(r => setTimeout(r, step.delay));
                addLog(step.msg, step.type);
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = "Initiate New Agent Sequence";
            }, 1000);
        }
    </script>
</body>
</html>
